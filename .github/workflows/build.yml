name: Build Juver EP7 Win32

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Stage solution at repo root (sln project paths are root-relative)
        run: Copy-Item legacy\RanOnline.sln RanOnline.sln
      - name: Build legacy solution Release Win32
        run: msbuild RanOnline.sln /m /p:Configuration=Release /p:Platform=Win32
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Path . -Recurse -Include *.exe,*.dll | Where-Object { $_.FullName -notmatch '\\.git\\' } | Copy-Item -Destination out -Force
          Get-ChildItem out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ran-juver-win32
          path: out
          if-no-files-found: warn
