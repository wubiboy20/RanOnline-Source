name: Build Juver EP7 Win32

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build.yml'

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: microsoft/setup-msbuild@v2
      - name: Fix solution project paths (sln paths are root-relative)
        shell: pwsh
        run: |
          $sln = 'legacy\RanOnline.sln'
          (Get-Content $sln) -replace '"legacy\\', '"' | Set-Content $sln
      - name: Install full Boost headers (bundled Tik boost is partial)
        shell: pwsh
        run: |
          curl.exe -fL -o boost.tgz 'https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.gz'
          if ((Get-Item boost.tgz).Length -lt 100MB) { throw 'Boost download too small, not a real tarball' }
          tar -xzf boost.tgz boost_1_86_0/boost
          New-Item -ItemType Directory -Force legacy\boost186 | Out-Null
          Copy-Item -Recurse -Force boost_1_86_0\boost legacy\boost186\boost
          Copy-Item -Recurse -Force boost_1_86_0\boost\* legacy\Tik\Include\boost\
      - name: Prepend include dirs (Boost 1.86, GMTool) for all legacy projects
        shell: pwsh
        run: |
          $props = @'
          <Project>
            <ItemDefinitionGroup>
              <ClCompile>
                <AdditionalIncludeDirectories>$(MSBuildThisFileDirectory)boost186;$(MSBuildThisFileDirectory)GMTool;%(AdditionalIncludeDirectories)</AdditionalIncludeDirectories>
              </ClCompile>
            </ItemDefinitionGroup>
          </Project>
          '@
          Set-Content -Path 'legacy\Directory.Build.props' -Value $props
      - name: Fetch dependency libraries (this repo gitignores *.lib; take them from the EP7 x64 fork)
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/wubiboy20/RANOnline-x64.git deps-x64
          New-Item -ItemType Directory -Force legacy\Tik\Library | Out-Null
          Copy-Item deps-x64\Dependency\directx\x86\*.lib legacy\Tik\DXLib\
          Copy-Item deps-x64\Dependency\commonlib\*.lib legacy\Tik\Library\
          Copy-Item deps-x64\Dependency\lzo\*.lib legacy\Tik\Library\
          $shim = @'
          #pragma once
          // Shim for the missing GMTOOL.h: EditorItem only needs the GMTOOL namespace
          // functions, implemented in Lib_Client (see Lib_Client/DxServerInstance.h).
          namespace GMTOOL
          {
              HRESULT Create( const char* szAppPath );
              void CleanUp();
          }
          '@
          Set-Content -Path legacy\EditorItem\GMTOOL.h -Value $shim
          Get-ChildItem legacy\Tik\DXLib, legacy\Tik\Library | Select-Object Name, Length
      - name: Build stub libraries (ggsrvlib, tbb, HShield are not in this repo)
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvarsall.bat" x86
          if errorlevel 1 exit /b 1
          cl /nologo /c legacy\ggstub.cpp /Fo:ggstub.obj
          if errorlevel 1 exit /b 1
          lib /nologo /OUT:legacy\Tik\Library\ggsrvlib.lib ggstub.obj
          if errorlevel 1 exit /b 1
          cl /nologo /c /EHsc /MD /I legacy\Tik\TbbLib\include legacy\tbbstub.cpp /Fo:tbbstub.obj
          if errorlevel 1 exit /b 1
          lib /nologo /OUT:legacy\Tik\Library\tbb.lib tbbstub.obj
          if errorlevel 1 exit /b 1
          if not exist legacy\Tik\TbbLib\lib mkdir legacy\Tik\TbbLib\lib
          copy /y legacy\Tik\Library\tbb.lib legacy\Tik\TbbLib\lib\tbb.lib
          cl /nologo /c legacy\emptylib.cpp /Fo:empty.obj
          if errorlevel 1 exit /b 1
          lib /nologo /OUT:legacy\Tik\Library\HShield.lib empty.obj
          if errorlevel 1 exit /b 1
          cl /nologo /c /I legacy\Tik\Include legacy\ijlstub.cpp /Fo:ijlstub.obj
          if errorlevel 1 exit /b 1
          lib /nologo /OUT:legacy\Tik\Library\ijl15.lib ijlstub.obj
          if errorlevel 1 exit /b 1
          if not exist "legacy\=Library" mkdir "legacy\=Library"
          copy /y legacy\Tik\Library\ijl15.lib "legacy\=Library\ijl15.lib"
          cl /nologo /c /I legacy\Lib_Network legacy\apexstub.cpp /Fo:apexstub.obj
          if errorlevel 1 exit /b 1
          lib /nologo /OUT:"legacy\=Library\AHClientInterface.lib" apexstub.obj
          if errorlevel 1 exit /b 1
      - name: Build legacy solution Release Win32 (two passes; harvest built libs between passes)
        env:
          CL: /D_NO_HACKSHIELD
        shell: pwsh
        run: |
          msbuild legacy\RanOnline.sln /m /p:Configuration=Release /p:Platform=Win32
          Get-ChildItem -Path RanOnline-Build\Release -Recurse -Filter *.lib | Copy-Item -Destination legacy\Tik\Library\ -Force
          Get-ChildItem legacy\Tik\Library | Select-Object Name, Length
          msbuild legacy\RanOnline.sln /m /p:Configuration=Release /p:Platform=Win32
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Collect binaries
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Get-ChildItem -Path . -Recurse -Include *.exe,*.dll | Where-Object { $_.FullName -notmatch '\\.git\\' } | Copy-Item -Destination out -Force
          Get-ChildItem out | Select-Object Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: ran-juver-win32
          path: out
          if-no-files-found: warn
# trigger run 15
